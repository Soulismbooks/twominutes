<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Gold and silver prices in India</title>
<desc id="desc">Gold bars and coins beside silver bars and coins, with a market chart in the background.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071727"/><stop offset=".55" stop-color="#142c43"/><stop offset="1" stop-color="#06121f"/></linearGradient>
 <radialGradient id="glowG"><stop stop-color="#d99028" stop-opacity=".45"/><stop offset="1" stop-color="#d99028" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowS"><stop stop-color="#9fc7df" stop-opacity=".35"/><stop offset="1" stop-color="#9fc7df" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a3"/><stop offset=".28" stop-color="#f4c04f"/><stop offset=".62" stop-color="#bf7415"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
 <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9a82e"/><stop offset="1" stop-color="#74400d"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".3" stop-color="#c8d7e1"/><stop offset=".65" stop-color="#718898"/><stop offset="1" stop-color="#eef4f8"/></linearGradient>
 <linearGradient id="silverSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9cbd6"/><stop offset="1" stop-color="#425768"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263a4a"/><stop offset="1" stop-color="#08131e"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="13"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
